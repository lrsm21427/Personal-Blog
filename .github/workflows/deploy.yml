name: Deploy to Server

on:
  push:
    branches:
      - master
    paths-ignore:
      - "DEPLOYMENTS.md"
  schedule:
    # 每天北京时间 00:00（UTC 16:00）自动构建并部署
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: ".vitepress/dist"
          target: "/home/dist-test"
          strip_components: 2

      - name: Record successful deployment
        env:
          TZ: Asia/Shanghai
        run: |
          DEPLOYED_AT=$(date '+%Y-%m-%d %H:%M:%S %Z')
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '\n| %s | `%s` | [查看运行](%s) |\n' "$DEPLOYED_AT" "${GITHUB_SHA:0:7}" "$RUN_URL" >> DEPLOYMENTS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENTS.md
          git commit -m "chore: record deployment ${GITHUB_RUN_NUMBER}"
          git pull --rebase origin master
          git push origin HEAD:master
